
name: Build NOVA TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Vérifier les fichiers XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          while IFS= read -r file; do
            echo "Vérification de : $file"
            xmllint --noout "$file" || exit 1
          done < <(find app/src -name AndroidManifest.xml -type f)

      - name: Compiler l'APK avec diagnostic
        run: gradle assembleDebug --stacktrace --info

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
